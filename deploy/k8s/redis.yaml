# Local SSE buffer. Data loss is acceptable: only an in-progress chat stream is stored here.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: agent-sandbox
  labels:
    app.kubernetes.io/name: agent-sandbox
    app.kubernetes.io/component: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-sandbox
      app.kubernetes.io/component: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-sandbox
        app.kubernetes.io/component: redis
    spec:
      containers:
        - name: redis
          image: redis:7
          imagePullPolicy: IfNotPresent
          args: ["--save", "", "--appendonly", "no"]
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: agent-sandbox
  labels:
    app.kubernetes.io/name: agent-sandbox
    app.kubernetes.io/component: redis
spec:
  selector:
    app.kubernetes.io/name: agent-sandbox
    app.kubernetes.io/component: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
